[build]
  publish = "site"
  functions = "netlify/functions"

# Daily email-path canary (netlify/functions/email-health.js).
[functions."email-health"]
  schedule = "@daily"

# Hourly; acts only at 07:00 America/Chicago (netlify/functions/event-reminders.js).
[functions."event-reminders"]
  schedule = "0 * * * *"

# Monthly executive summary on the 1st (netlify/functions/submissions-report.js).
[functions."submissions-report"]
  schedule = "0 13 1 * *"

# Weekly rebook/waitlist backlog on Mondays (netlify/functions/rebook-report.js).
[functions."rebook-report"]
  schedule = "0 13 * * 1"

# Monthly OTT completed-calibrations DRAFT on the 1st (netlify/functions/ott-report.js).
# Covers the month that just closed; emails a DRAFT + approve-link to the owner only.
# The owner's approval triggers ott-report-send.js, which emails OTT.
[functions."ott-report"]
  schedule = "0 13 1 * *"

# OTT submission DEADLINE REMINDER on the 5th (netlify/functions/ott-report-reminder.js).
# Submission is due by the 7th; this nudges the owner (email + Slack, never OTT) two
# days ahead if the prior month has calibrations, re-surfacing the approve link.
[functions."ott-report-reminder"]
  schedule = "0 13 5 * *"

# Annual private OTT rollup (Tuned Yota internal) on Jan 1 for the prior year
# (netlify/functions/ott-annual.js). Emails info@ only — never OTT. Also on-demand
# via a token-gated HTTP call (?year=YYYY&token=OTT_APPROVE_SECRET).
[functions."ott-annual"]
  schedule = "0 14 1 1 *"

# Daily Certificate of Authenticity dispatch (netlify/functions/certificate-dispatch.js).
[functions."certificate-dispatch"]
  schedule = "0 14 * * *"

# Daily AMSOIL follow-up: ~3 days post-tune (netlify/functions/amsoil-followup.js).
# Active 2026-07-14 (AMSOIL_FOLLOWUP_START=2020-01-01 → all completed tunes on record).
[functions."amsoil-followup"]
  schedule = "0 15 * * *"

# Morning lead follow-up sweep: web-push each installer their due/overdue leads
# (netlify/functions/lead-followups.js). 13:00 UTC ≈ 8:00am Central.
[functions."lead-followups"]
  schedule = "0 13 * * *"

# Inbox sweep: classify info@ mail, ingest OTT leads, create NEPQ reply drafts.
[functions."inbox-sweep"]
  schedule = "*/15 * * * *"

[functions."ott-reply-sweep"]
  schedule = "*/15 * * * *"

# Inbox draft review digest — 8am / noon / 7pm Central (CDT): 13:00, 17:00, 00:00 UTC.
# (CST winter shifts these an hour later local — acceptable.)
[functions."inbox-digest"]
  schedule = "0 0,13,17 * * *"

# Researcher nurture sequence — daily 15:00 UTC (~9-10am CT). Sends the next
# lead-magnet nurture email to opt-ins who haven't booked (netlify/functions/nurture-sweep.js).
[functions."nurture-sweep"]
  schedule = "0 15 * * *"

# Daily purge of bookings soft-cancelled 30+ days ago (netlify/functions/purge-cancelled.js).
# Only records stamped "Cancelled At" by the console delete are eligible.
[functions."purge-cancelled"]
  schedule = "@daily"

# Daily SMS volume canary → Slack, morning Central (netlify/functions/sms-volume-report.js).
# Added 2026-07-27 to watch A2P volume after the chat relay went live.
[functions."sms-volume-report"]
  schedule = "0 13 * * *"

# Weekly GA4 digest, Mondays 13:00 UTC ≈ 8am Central (netlify/functions/ga-weekly-report.js).
# Emails info@ the full digest + one Slack line. Added 2026-07-29 with the GA tag install.
[functions."ga-weekly-report"]
  schedule = "0 13 * * 1"

# Legacy Wix-site URLs (pre-2026 www.tunedyota.com) still indexed by Google — 301 each
# to its closest new page so residual rankings/traffic land somewhere useful instead of 404.
# Specific paths first; /post/* and /service-page/* catch-alls last (first match wins).
[[redirects]]
  from = "/services-1"
  to = "/ott-tune"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/team"
  status = 301

[[redirects]]
  from = "/about"
  to = "/team"
  status = 301

[[redirects]]
  from = "/about-5"
  to = "/team"
  status = 301

[[redirects]]
  from = "/gift-card"
  to = "/"
  status = 301

[[redirects]]
  from = "/service-page/4runner-5th-gen-4-0l-v6-2020-2023"
  to = "/toyota-4runner-ott-tune"
  status = 301

[[redirects]]
  from = "/service-page/sequoia-2nd-gen-5-7l-v8-2007-2018"
  to = "/toyota-sequoia-ott-tune"
  status = 301

[[redirects]]
  from = "/service-page/land-cruiser-lc250-2-4l-i4-2024"
  to = "/toyota-land-cruiser-ott-tune"
  status = 301

[[redirects]]
  from = "/service-page/tacoma-2nd-gen-4-0l-v6-2005-2015"
  to = "/toyota-tacoma-ott-tune"
  status = 301

[[redirects]]
  from = "/service-page/tacoma-3rd-gen-3-5l-v6-2016-2023"
  to = "/toyota-tacoma-ott-tune"
  status = 301

[[redirects]]
  from = "/service-page/tacoma-4th-gen-2-4l-i4-hybrid-2024"
  to = "/toyota-tacoma-ott-tune"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/faq"
  status = 301

[[redirects]]
  from = "/service-page/*"
  to = "/find-your-exact-tune"
  status = 301

# Per-event booking links: /book/<city-slug>-<date> → the times-first mini flow
# (200 rewrite keeps the pretty URL; book.html reads the slug from location.pathname).
[[redirects]]
  from = "/book/*"
  to = "/book.html"
  status = 200

# "Get OTT Now!" share link -> the decision funnel, tagged to the share campaign.
[[redirects]]
  from = "/get-ott-now"
  to = "/find-your-exact-tune?utm_source=share&utm_medium=social&utm_campaign=get-ott-now"
  status = 302

# Serve the PWA manifest with the correct MIME (Netlify defaults .webmanifest to octet-stream).
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
